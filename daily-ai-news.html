<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03月20日 AI前沿动态</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 20px; margin-bottom: 8px; }
        .meta { font-size: 12px; opacity: 0.8; }
        .summary {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .summary h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
        .cat-tag {
            display: inline-block;
            background: #e8f4fd;
            color: #0066cc;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .summary-item {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 6px;
        }
        .summary-title {
            display: block;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-right: 6px;
            margin-bottom: 4px;
        }
        .card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .priority {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            font-weight: bold;
        }
        .priority.high { background: #ff4d4f; color: white; }
        .priority.medium { background: #faad14; color: white; }
        .priority.low { background: #d9d9d9; color: #666; }
        .title { font-size: 16px; font-weight: 600; color: #1a1a2e; flex: 1; }
        .body { font-size: 14px; color: #666; margin-bottom: 12px; }
        .key-points {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .key-points li {
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
            list-style: none;
            padding-left: 12px;
            position: relative;
        }
        .key-points li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #0066cc;
        }
        .related {
            background: #fff7e6;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #d46b08;
            margin-bottom: 8px;
        }
        .source { font-size: 12px; color: #999; }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 20px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #0066cc;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 18px; }
            .title { font-size: 15px; }
            .body { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 03月20日 AI前沿动态</h1>
        <div class="meta">自动汇总 | 24h | 共 28 条</div>
    </div>

    <div class="summary">
        <h2>📌 要点速览</h2>
    </div>
    <div class="content">
    </div>
    <div class="footer">
        更新时间: 2026-03-20 10:49
    </div>
</body>
</html>
