# ============ 配置项 ============
settings:
  max_per_account: 3
  max_hours: 24
  nitter_instances:
    - "https://nitter.net"
    - "https://nitter.poast.org"
    - "https://nitter.privacydev.net"
    - "https://nitter.hu"

  # 分类映射
  categories:
    - name: "Company"
      description: "公司官方账号"
    - name: "Researcher"
      description: "研究者个人账号"

  # ai-research-agent 四赛道
  tracks:
    - name: "Model"
      description: "大模型、架构创新"
    - name: "Infra"
      description: "算力、芯片、云服务"
    - name: "Research"
      description: "论文、学术突破"
    - name: "App"
      description: "应用、产品、商业化"
